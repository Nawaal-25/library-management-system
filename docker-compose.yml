services:

  mysql:
    image: mysql:8.0
    container_name: library-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: library_db
    ports:
      - "3307:3306"

  backend:
    build: ./backend
    container_name: library-backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql